<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="box">
      <rect width="512" height="512"/>
    </clipPath>
  </defs>
  <g clip-path="url(#box)">
    <!-- Black square background -->
    <rect width="512" height="512" fill="#000000"/>
    <!-- Red diagonal slash — ::before (4px × 35px rotated 41deg, scaled 17.66x) -->
    <rect x="220" y="-200" width="71" height="912" fill="#ff0000" transform="rotate(41 256 256)"/>
    <!-- Red diagonal dash — ::after (18px × 2px rotated -41deg, scaled 17.66x) -->
    <rect x="97" y="239" width="318" height="35" fill="#ff0000" transform="rotate(-41 256 256)"/>
    <!-- P+ text -->
    <text x="256" y="285" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="700" font-size="190" fill="#f5f5f5" letter-spacing="-6">P+</text>
  </g>
</svg>
