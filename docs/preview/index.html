    <script>
      // Theme initialization - runs before first paint to avoid FOUC.
      // Three-state preference model:
      //   - saved "dark"  -> set data-theme="dark"
      //   - saved "light" -> set data-theme="light" (explicit, overrides OS)
      //   - no preference -> follow prefers-color-scheme, else leave absent (base :root)
      (function () {
        try {
          var saved = localStorage.getItem("proximity-theme");
          var el = document.documentElement;
          if (saved === "light") {
            el.dataset.theme = "light";
          } else if (saved === "dark") {
            el.dataset.theme = "dark";
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            el.dataset.theme = "dark";
          }
        } catch (e) {
          /* localStorage unavailable - fall back to base :root styles */
        }
      })();
    </script>

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains("songs")) db.createObjectStore("songs", { keyPath: "id" });
        if (!db.objectStoreNames.contains("playlists")) db.createObjectStore("playlists", { keyPath: "id" });
        if (!db.objectStoreNames.contains("eq_profiles")) db.createObjectStore("eq_profiles", { keyPath: "id" });
        if (!db.objectStoreNames.contains("play_history")) {
          var h = db.createObjectStore("play_history", { keyPath: "id" });
          h.createIndex("playedAt", "playedAt");
          h.createIndex("songId", "songId");
        }
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }

  function countSongs(db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("songs", "readonly");
      var req = tx.objectStore("songs").count();
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function saveSong(db, song) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("songs", "readwrite");
      tx.objectStore("songs").put(song);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  var SEED_VERSION = 2; // bump this to force re-seed

  async function clearSongs(db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("songs", "readwrite");
      tx.objectStore("songs").clear();
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  async function seed() {
    var db = await openDB();
    var savedVersion = parseInt(localStorage.getItem("preview-seed-version") || "0", 10);
    if (savedVersion >= SEED_VERSION) {
      var count = await countSongs(db);
      if (count >= SEED_SONGS.length) {
        console.log("[Preview] Songs already loaded (" + count + "), skipping seed.");
        return;
      }
    }
    // Clear old data and re-seed
    console.log("[Preview] Clearing old songs and re-seeding " + SEED_SONGS.length + " songs...");
    await clearSongs(db);
    for (var i = 0; i < SEED_SONGS.length; i++) {
      var songMeta = Object.assign({}, SEED_SONGS[i]);
      delete songMeta.audioFile;
      try {
        var resp = await fetch("audio/" + SEED_SONGS[i].audioFile);
        var blob = await resp.blob();
        songMeta.audioBlob = blob;
        await saveSong(db, songMeta);
        console.log("[Preview] Saved: " + songMeta.title);
      } catch (e) {
        console.warn("[Preview] Failed to load audio for " + songMeta.title + ":", e);
        songMeta.audioBlob = new Blob([], { type: "audio/mpeg" });
        await saveSong(db, songMeta);
      }
    }
    localStorage.setItem("preview-seed-version", String(SEED_VERSION));
    console.log("[Preview] Seed complete! Refresh to see songs.");
  }

  // Run seeding before React mounts
  seed().catch(function (e) { console.error("[Preview] Seed error:", e); });
})();
