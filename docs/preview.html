<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>proximity+ — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f5f5f5;--ink:#000;--red:#ff0000;--red-dark:#b80000;
  --line:#000;--text-secondary:#666;--ease-mechanical:cubic-bezier(.23,1,.32,1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Space Grotesk',sans-serif;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;position:relative;
}
.mono{font-family:'IBM Plex Mono',monospace}

/* ─── TOP BAR ─── */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-bottom:2px solid var(--line);min-height:56px;
  background:var(--ink);color:var(--paper);position:relative;z-index:100;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:36px;height:36px;border:2px solid var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;letter-spacing:-1px;flex-shrink:0;
}
.brand-text{font-weight:600;font-size:14px;letter-spacing:3px;text-transform:uppercase}
.preview-badge{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
  color:var(--red);text-transform:uppercase;font-weight:600;
  border:1px solid var(--red);padding:4px 10px;
}

/* ─── MAIN AREA ─── */
.main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;transition:opacity .25s var(--ease-mechanical)}
.view.hidden{opacity:0;pointer-events:none}

/* ─── LIBRARY VIEW ─── */
.library{padding:0}
.library-header{
  padding:20px 24px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:12px;
}
.library-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:600}
.library-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-secondary)}

.song-table{width:100%;border-collapse:collapse}
.song-table thead{position:sticky;top:0;z-index:10}
.song-table th{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;font-weight:500;color:var(--text-secondary);
  text-align:left;padding:10px 24px;border-bottom:2px solid var(--line);
  background:var(--paper);
}
.song-table th:last-child{text-align:right}
.song-table td{padding:14px 24px;border-bottom:1px solid #ddd;font-size:14px}
.song-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary)}
.song-row{cursor:pointer;transition:background .1s}
.song-row:hover{background:#e8e8e8}
.song-row.active{background:var(--ink);color:var(--paper)}
.song-row.active td{border-bottom-color:var(--ink);color:var(--paper)}
.song-row.active td:last-child{color:#999}
.song-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);width:40px}
.song-row.active .song-num{color:#999}
.song-title-cell{font-weight:500}
.song-artist{color:var(--text-secondary);font-size:13px}
.song-row.active .song-artist{color:#999}
.song-album{font-size:13px;color:var(--text-secondary)}
.song-row.active .song-album{color:#999}

/* ─── NOW PLAYING BAR ─── */
.np-bar{
  min-height:72px;border-top:2px solid var(--line);display:flex;flex-direction:column;
  background:var(--ink);color:var(--paper);position:relative;z-index:100;
}
.np-progress-wrap{
  height:4px;background:#333;cursor:pointer;position:relative;
}
.np-progress-bar{height:100%;background:var(--red);width:0%;pointer-events:none}
.np-main{display:flex;align-items:center;flex:1;padding:0 24px;gap:20px}
.np-info{flex:1;min-width:0;cursor:pointer;overflow:hidden}
.np-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-controls{display:flex;align-items:center;gap:16px}
.np-btn{
  background:none;border:none;color:var(--paper);cursor:pointer;
  font-size:18px;padding:8px;display:flex;align-items:center;justify-content:center;
  transition:color .1s;
}
.np-btn:hover{color:var(--red)}
.np-btn.play-btn{font-size:22px}
.np-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#999;min-width:90px;text-align:center}
.np-expand{
  background:none;border:1px solid #444;color:#999;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;padding:5px 10px;
}
.np-expand:hover{border-color:var(--red);color:var(--red)}

/* ─── FULLSCREEN PLAYER ─── */
.fullscreen{display:flex;flex-direction:column;height:100%}
.fs-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-bottom:1px solid #222;
}
.fs-close{
  background:none;border:1px solid #444;color:#999;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;padding:5px 12px;
}
.fs-close:hover{border-color:var(--red);color:var(--red)}
.fs-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#555;text-transform:uppercase}

.fs-body{flex:1;display:flex;overflow:hidden}
.fs-left{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;gap:32px;min-width:0;
}
.fs-art{
  width:240px;height:240px;border:2px solid var(--paper);
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
}
.fs-art-mark{font-size:64px;font-weight:700;color:var(--paper);letter-spacing:-4px;opacity:.9}
.fs-art-label{
  position:absolute;bottom:12px;right:12px;font-family:'IBM Plex Mono',monospace;
  font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase;
}
.fs-meta{text-align:center}
.fs-song-title{font-size:28px;font-weight:600;margin-bottom:6px}
.fs-song-artist{font-size:16px;color:var(--text-secondary)}

.fs-right{
  width:380px;border-left:2px solid #222;display:flex;flex-direction:column;
  background:#0a0a0a;
}
.fs-lyrics-header{
  padding:16px 20px;border-bottom:1px solid #222;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;
  color:#555;text-transform:uppercase;
}
.fs-lyrics{
  flex:1;overflow-y:auto;padding:24px 20px;scroll-behavior:smooth;
  mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);
}
.fs-lyrics::-webkit-scrollbar{width:4px}
.fs-lyrics::-webkit-scrollbar-track{background:#111}
.fs-lyrics::-webkit-scrollbar-thumb{background:#333}

.lyric-line{
  padding:8px 0;font-size:16px;line-height:1.6;color:#444;
  transition:all .3s var(--ease-mechanical);text-align:center;
  cursor:default;
}
.lyric-line.past{color:#333}
.lyric-line.current{
  color:var(--red);font-size:22px;font-weight:600;
  transform:scale(1.02);
}
.lyric-line.future{color:#555}
.lyric-line.empty-line{height:24px}

.fs-controls{
  padding:20px 24px;border-top:2px solid #222;
  display:flex;flex-direction:column;gap:12px;
}
.fs-progress-wrap{height:4px;background:#222;cursor:pointer;position:relative}
.fs-progress-bar{height:100%;background:var(--red);width:0%;pointer-events:none}
.fs-transport{display:flex;align-items:center;justify-content:center;gap:24px}
.fs-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#666}
.fs-btn{
  background:none;border:none;color:var(--paper);cursor:pointer;
  font-size:22px;padding:8px;display:flex;align-items:center;justify-content:center;
}
.fs-btn:hover{color:var(--red)}
.fs-btn.play{font-size:28px}

/* ─── LOADING ─── */
.loading-overlay{
  position:fixed;inset:0;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:16px;
}
.loading-overlay .spinner{
  width:24px;height:24px;border:2px solid #333;border-top-color:var(--red);
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay .label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:#666;
}

/* scrollbar global */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:#ccc}
</style>

/* ═══════════════════════════════════════════
   INDEXEDDB LAYER
   ═══════════════════════════════════════════ */
const DB_NAME = 'audiovisual_player_db';
const DB_VERSION = 2;
const STORE_SONGS = 'songs';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('eq_profiles')) db.createObjectStore('eq_profiles', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('play_history')) {
        const h = db.createObjectStore('play_history', { keyPath: 'id' });
        h.createIndex('playedAt', 'playedAt');
        h.createIndex('songId', 'songId');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAllSongs(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_SONGS, 'readonly');
    const req = tx.objectStore(STORE_SONGS).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function putSong(db, song) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_SONGS, 'readwrite');
    tx.objectStore(STORE_SONGS).put(song);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function slugify(filename) {
  return filename.replace(/\.mp3$/i, '').replace(/[^a-z0-9]+/gi, '-').replace(/(^-|-$)/g, '').toLowerCase();
}

async function fetchAndBlob(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Failed to fetch ${url}: ${resp.status}`);
  return resp.blob();
}

async function populateDB(db) {
  for (const song of SONG_DATA) {
    const id = slugify(song.filename);
    const audioBlob = await fetchAndBlob('audio/' + song.filename);
    await putSong(db, {
      id,
      title: song.title,
      artist: song.artist,
      album: song.album || '',
      albumCover: '',
      duration: song.duration,
      lyrics: song.lyrics || '',
      syncedLyrics: song.syncedLyrics || [],
      audioBlob,
      eqProfileId: '',
      createdAt: Date.now()
    });
  }
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function loadSongBlob(song) {
  return new Promise((resolve, reject) => {
    openDB().then(db => {
      const tx = db.transaction(STORE_SONGS, 'readonly');
      const req = tx.objectStore(STORE_SONGS).get(song.id);
      req.onsuccess = () => resolve(req.result ? req.result.audioBlob : null);
      req.onerror = () => reject(req.error);
    });
  });
}

async function playSong(index) {
  if (index < 0 || index >= songsDB.length) return;
  currentIndex = index;
  const song = songsDB[index];

  // Get blob from IDB
  const blob = await loadSongBlob(song);
  if (!blob) return;

  if (audio) {
    audio.pause();
    audio.src = '';
  }

  audio = new Audio();
  audio.src = URL.createObjectURL(blob);

  audio.addEventListener('loadedmetadata', () => {
    updateNowPlaying(song);
    updateFsMeta(song);
    renderLyrics(song);
    updateTimeDisplays();
  });

  audio.addEventListener('timeupdate', onTimeUpdate);
  audio.addEventListener('ended', onSongEnded);
  audio.addEventListener('play', () => { isPlaying = true; updatePlayButtons(); });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayButtons(); });

  audio.play().catch(() => {});
  highlightActiveRow();
}

function togglePlay() {
  if (!audio) return;
  if (isPlaying) audio.pause();
  else audio.play().catch(() => {});
}

function nextSong() {
  if (songsDB.length === 0) return;
  const next = (currentIndex + 1) % songsDB.length;
  playSong(next);
}

function prevSong() {
  if (songsDB.length === 0) return;
  if (audio && audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  const prev = (currentIndex - 1 + songsDB.length) % songsDB.length;
  playSong(prev);
}

function seek(offset) {
  if (!audio) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + offset));
}

function seekTo(fraction) {
  if (!audio || !audio.duration) return;
  audio.currentTime = fraction * audio.duration;
}

/* ═══════════════════════════════════════════
   UI UPDATES
   ═══════════════════════════════════════════ */
function updateNowPlaying(song) {
  $('#npTitle').textContent = song.title;
  $('#npArtist').textContent = song.artist;
}

function updateFsMeta(song) {
  $('#fsTitle').textContent = song.title;
  $('#fsArtist').textContent = song.artist;
}

function updatePlayButtons() {
  const icon = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  $('#npPlay').innerHTML = icon;
  $('#fsPlay').innerHTML = icon;
}

function updateTimeDisplays() {
  if (!audio) return;
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  const pct = dur ? (cur / dur * 100) : 0;
  $('#npProgressBar').style.width = pct + '%';
  $('#fsProgressBar').style.width = pct + '%';
  $('#npTime').textContent = formatTime(cur) + ' / ' + formatTime(dur);
  $('#fsTimeCurrent').textContent = formatTime(cur);
  $('#fsTimeTotal').textContent = formatTime(dur);
}

function highlightActiveRow() {
  $$('.song-row').forEach((row, i) => {
    row.classList.toggle('active', i === currentIndex);
  });
}

function onTimeUpdate() {
  updateTimeDisplays();
  updateLyricsHighlight();
}

function onSongEnded() {
  nextSong();
}

/* ═══════════════════════════════════════════
   LYRICS
   ═══════════════════════════════════════════ */
function renderLyrics(song) {
  const container = $('#fsLyrics');
  container.innerHTML = '';
  currentLyricIdx = -1;

  const lines = song.syncedLyrics || [];
  if (lines.length === 0) {
    container.innerHTML = '<div class="lyric-line" style="color:#444;font-style:italic">No synced lyrics available</div>';
    return;
  }

  lines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'lyric-line future';
    div.dataset.idx = i;
    div.textContent = line.text || '\u00A0';
    if (!line.text) div.classList.add('empty-line');
    div.addEventListener('click', () => {
      if (audio && line.time != null) audio.currentTime = line.time;
    });
    container.appendChild(div);
  });
}

function updateLyricsHighlight() {
  if (!audio) return;
  const song = songsDB[currentIndex];
  if (!song) return;
  const lines = song.syncedLyrics || [];
  if (lines.length === 0) return;

  const t = audio.currentTime;
  let idx = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].time <= t) { idx = i; break; }
  }

  if (idx === currentLyricIdx) return;
  currentLyricIdx = idx;

  const els = $$('.lyric-line');
  els.forEach((el, i) => {
    el.classList.remove('past', 'current', 'future');
    if (i < idx) el.classList.add('past');
    else if (i === idx) el.classList.add('current');
    else el.classList.add('future');
  });

  if (idx >= 0 && els[idx]) {
    const container = $('#fsLyrics');
    const el = els[idx];
    const cRect = container.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const offset = eRect.top - cRect.top - cRect.height / 2 + eRect.height / 2;
    container.scrollBy({ top: offset, behavior: 'smooth' });
  }
}

/* ═══════════════════════════════════════════
   LIBRARY RENDER
   ═══════════════════════════════════════════ */
function renderLibrary(songs) {
  const tbody = $('#songList');
  tbody.innerHTML = '';
  $('#songCount').textContent = songs.length + ' tracks';

  songs.forEach((song, i) => {
    const tr = document.createElement('tr');
    tr.className = 'song-row';
    tr.dataset.index = i;
    tr.innerHTML =
      '<td class="song-num mono">' + (i + 1) + '</td>' +
      '<td class="song-title-cell">' + escHtml(song.title) + '</td>' +
      '<td class="song-artist">' + escHtml(song.artist) + '</td>' +
      '<td class="song-album">' + escHtml(song.album || '—') + '</td>' +
      '<td class="mono">' + formatTime(song.duration) + '</td>';
    tr.addEventListener('click', () => playSong(i));
    tbody.appendChild(tr);
  });

  highlightActiveRow();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ═══════════════════════════════════════════
   VIEW SWITCHING
   ═══════════════════════════════════════════ */
function showFullscreen() {
  showingFullscreen = true;
  $('#libraryView').classList.add('hidden');
  $('#fullscreenView').classList.remove('hidden');
}

function showLibrary() {
  showingFullscreen = false;
  $('#fullscreenView').classList.add('hidden');
  $('#libraryView').classList.remove('hidden');
}

/* ═══════════════════════════════════════════
   EVENT BINDING
   ═══════════════════════════════════════════ */
$('#npPlay').addEventListener('click', togglePlay);
$('#npPrev').addEventListener('click', prevSong);
$('#npNext').addEventListener('click', nextSong);
$('#npExpand').addEventListener('click', showFullscreen);
$('#npInfo').addEventListener('click', () => { if (currentIndex >= 0) showFullscreen(); });

$('#fsPlay').addEventListener('click', togglePlay);
$('#fsPrev').addEventListener('click', prevSong);
$('#fsNext').addEventListener('click', nextSong);
$('#fsClose').addEventListener('click', showLibrary);

$('#npProgressWrap').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  seekTo((e.clientX - r.left) / r.width);
});

$('#fsProgressWrap').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  seekTo((e.clientX - r.left) / r.width);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      seek(-5);
      break;
    case 'ArrowRight':
      e.preventDefault();
      seek(5);
      break;
    case 'Escape':
      e.preventDefault();
      if (showingFullscreen) showLibrary();
      break;
  }
});

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
(async function init() {
  const overlay = $('#loadingOverlay');
  try {
    const db = await openDB();
    let songs = await getAllSongs(db);

    if (songs.length === 0) {
      await populateDB(db);
      songs = await getAllSongs(db);
    }

    // Sort by createdAt for consistent order
    songs.sort((a, b) => a.createdAt - b.createdAt);
    songsDB = songs;
    renderLibrary(songs);
  } catch (err) {
    console.error('Init error:', err);
    overlay.innerHTML = '<div class="label" style="color:#ff0000">Error: ' + escHtml(String(err)) + '</div>';
    return;
  }
  overlay.style.display = 'none';
})();
</script>
</body>
</html>
